version: '3.8'

services:
  cv-analyzer:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models
      - ./results:/app/results
    environment:
      - CV_MAX_VIDEO_SIZE=${CV_MAX_VIDEO_SIZE:-1073741824}
      - CV_BATCH_SIZE=${CV_BATCH_SIZE:-4}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [[gpu]]
    networks:
      - tss-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - cv-analyzer
    networks:
      - tss-network

networks:
  tss-network:
    driver: bridge
